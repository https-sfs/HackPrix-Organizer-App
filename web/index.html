<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HackPrix event companion for seats, schedule, and live updates.">
  <meta name="theme-color" content="#2D6BFF">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HackPrix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <title>HackPrix</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }

    #hackprix-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #hackprix-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #hackprix-splash img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    #hackprix-splash h1 {
      margin: 24px 0 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #10203A;
    }
  </style>
</head>
<body>
  <div id="hackprix-splash" aria-label="Loading HackPrix">
    <img src="icons/Icon-192.png" alt="HackPrix logo">
    <h1>HackPrix</h1>
  </div>

  <script>
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("hackprix-splash");
      if (!splash) return;
      splash.classList.add("hidden");
      window.setTimeout(function () {
        splash.remove();
      }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
