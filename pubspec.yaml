name: "hackprix_app"
description: "A Flutter application for seat allotment and admin management for hackers wellbeing at Hackprix."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.32.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.7.10

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true